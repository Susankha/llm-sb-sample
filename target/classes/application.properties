spring.application.name=LLM
server.port=8082
## Ollama
#langchain4j.ollama.chat-model.base-url=http://localhost:11434
#langchain4j.ollama.chat-model.model-name=gemma3:1b
#langchain4j.ollama.chat-model.log-requests=true
#langchain4j.ollama.chat-model.log-responses=true

spring.ai.ollama.base-url= http://localhost:11434
spring.ai.ollama.chat.options.model= gemma3:1b

spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.chat.options.temperature=0.7

spring.ai.docker.compose.file=compose.yml
spring.ai.docker.compose.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5434/pdf_vector_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.ai.vectorstore.pgvector.table-name=pdf_vector_table
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=hnsw

logging.level.org.susa=DEBUG
logging.level.org.springframework.ai= DEBUG

#spring.ai.ollama.embedding.model= embeddinggemma:latest

